<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Rubik:wght@400;500;600&display=block" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { font-family: 'Rubik', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .poster { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .logo { position: absolute; top: 56px; left: 60px; height: 74px; z-index: 5; }
  h1, h2 { font-family: 'Montserrat', Arial, sans-serif; }
  .social { position: absolute; top: 66px; right: 60px; display: flex; gap: 14px; z-index: 5; }
  .social span { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; }
  {% block style %}{% endblock %}
</style>
</head>
<body><div class="poster">{% block body %}{% endblock %}</div></body>
</html>
