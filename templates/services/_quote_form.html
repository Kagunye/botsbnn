<form method="post" action="{% url 'services:quote' %}" class="quote-form" novalidate>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <div class="row g-3">
    {% for field in form %}
    <div class="{% if field.name == 'service' or field.name == 'message' %}col-12{% else %}col-sm-6{% endif %}">
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
      {{ field }}
      {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
    </div>
    {% endfor %}
  </div>
  <button type="submit" class="btn btn-brand btn-lg w-100 mt-3">Request my quote</button>
  <p class="small text-muted mt-2 mb-0 text-center">Free site assessment · We reply within one working day</p>
</form>
